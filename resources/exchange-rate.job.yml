resources:
  jobs:
    exchange_rate:
      name: exchange-rate
      git_source:
        git_url: https://github.com/hyemiJ/databricks-free-demo.git
        git_provider: gitHub
        git_branch: main
      tasks:
        - task_key: koreaexim-exchange-rate
          notebook_task:
            notebook_path: src/exchange-rate/koreaexim-exchange-rate
            base_parameters:
              search_date: "{{job.trigger.time.iso_date}}"
              secret_scope: ${var.secret_scope}
              secret_key: korea-exim-api-key
              data_type: AP01
              target_catalog: workspace
              target_schema: default
              target_table: daily_exchange_rate
              write_mode: append
            source: GIT
          environment_key: Default
      queue:
        enabled: true
      run_as:
        service_principal_name: ${var.job_manager_sp_id}
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED