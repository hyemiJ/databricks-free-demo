# This is a Declarative Automation Bundle definition for databricks_free_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_free_demo
  uuid: 7245e512-5352-49df-8d7c-f9d5bf750c9a

include:
  - resources/*.yml

sync:
  include:
    - src/**/*.* # *.ipynb, *.sql, *.scala, ...

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e94c9eea-8073.cloud.databricks.com
      # ${workspace.current_user.userName} = user 실행: haneul.kim@data-dynamics.io, sp 실행: 4abe3da9-f69d-4821-be1e-74cce377deda
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    git:
      origin_url: https://github.com/hyemiJ/databricks-free-demo.git
      branch: main
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-8d1b8955-b21c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/d1185284-4f87-4c40-9e68-ddb31350c87e to make sure we only have a single copy.
      root_path: /Workspace/Users/d1185284-4f87-4c40-9e68-ddb31350c87e/.bundle/${bundle.name}/${bundle.target}
      profile: PROD_SP
    variables:
      catalog: workspace
      schema: prod
    git:
      origin_url: https://github.com/hyemiJ/databricks-free-demo.git
      branch: main
    permissions:
      - service_principal_name: d1185284-4f87-4c40-9e68-ddb31350c87e
        level: CAN_MANAGE
